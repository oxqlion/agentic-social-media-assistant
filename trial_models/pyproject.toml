[project]
name = "trial-models"
version = "0.1.0"
description = "CLIP model benchmarking for iOS image retrieval"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "coremltools>=9.0",
    "einops>=0.8.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "num2words>=0.5.14",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "protobuf>=7.36.1",
    "qwen-vl-utils>=0.0.14",
    "sentencepiece>=0.2.2",
    "timm>=1.0.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers==4.51.3",
]

[dependency-groups]
dev = []
